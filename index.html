<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ether</title>

<!-- Ghost mode: uncomment the next line if you want the site unfindable by search,
     reachable only by people you give the URL to. Fits the "by introduction only" ethos. -->
<!-- <meta name="robots" content="noindex, nofollow"> -->
<meta name="description" content="Ether Strategic Communications.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='2' fill='%23d7e6ee' opacity='0.5'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400&family=Hanken+Grotesk:wght@300;400&display=swap" rel="stylesheet">

<script>document.documentElement.classList.add('js');</script>
<style>
  :root{
    --void:#06070a;
    --ash:#828d96;        /* faint base text */
    --lumen:#dcebf2;      /* cold moonlight — the reveal */
    --whisper:#8b98a2;    /* micro copy */
    --line:#2a323b;       /* hairline */
    --reveal-r:170px;
    --x:50%;
    --y:44%;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--void);
    color:var(--ash);
    font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:300;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* soft vignette so the centre feels like it's condensing out of the dark */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(120% 90% at 50% 44%, transparent 40%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
    z-index:2;
  }

  .stage{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vh 24px;
    z-index:3;
  }

  /* ---- the wordmark: two stacked copies ---- */
  .glyph{
    position:relative;
    line-height:1;
  }
  .word{
    display:block;
    font-family:"Cormorant",Georgia,serif;
    font-weight:300;
    font-size:clamp(3.4rem, 15vw, 9.5rem);
    letter-spacing:.14em;
    text-indent:.14em;          /* balance the trailing tracking */
  }
  .word.base{ color:var(--ash); opacity:.5; }
  /* with JS we drop the base right down so the page reads as near-empty */
  .js .word.base{ opacity:.08; }

  .word.reveal{
    position:absolute; inset:0;
    color:var(--lumen);
    opacity:0;
    text-shadow:0 0 34px rgba(190,224,240,.35);
    -webkit-mask-image:radial-gradient(circle var(--reveal-r) at var(--x) var(--y), #000 0%, #000 22%, transparent 68%);
            mask-image:radial-gradient(circle var(--reveal-r) at var(--x) var(--y), #000 0%, #000 22%, transparent 68%);
  }
  .js .word.reveal{ opacity:1; }

  .sub{
    margin-top:1.6rem;
    font-size:clamp(.62rem,1.9vw,.78rem);
    font-weight:300;
    letter-spacing:.52em;
    text-indent:.52em;
    color:var(--whisper);
    opacity:.62;
  }

  /* ---- contact ---- */
  .contact{
    margin-top:clamp(3.4rem,9vh,6rem);
    width:min(340px,80vw);
  }
  .cue{
    display:block;
    font-size:.72rem;
    letter-spacing:.18em;
    color:var(--whisper);
    opacity:.55;
    margin-bottom:1.1rem;
  }
  .field{
    position:relative;
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--line);
    transition:border-color .5s ease;
  }
  .field:focus-within{
    border-color:#8fa6b3;
    box-shadow:0 1px 0 rgba(143,166,179,.4);
  }

  .field input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    border-radius:0;
    -webkit-appearance:none;
            appearance:none;
    -webkit-tap-highlight-color:transparent;
    color:var(--lumen);
    font-family:inherit;
    font-weight:300;
    font-size:.98rem;
    letter-spacing:.06em;
    padding:.7rem 0;
    outline:none;
  }
  .field input:focus{ outline:none; }
  .field input::placeholder{ color:var(--ash); opacity:.4; letter-spacing:.06em; }

  .send{
    flex:0 0 auto;
    background:transparent;
    border:0;
    color:var(--whisper);
    cursor:pointer;
    font-size:1.1rem;
    line-height:1;
    padding:.4rem .2rem .4rem .8rem;
    opacity:0;
    transform:translateX(-4px);
    transition:opacity .4s ease, transform .4s ease, color .3s ease;
    pointer-events:none;
  }
  .field.filled .send{ opacity:.7; transform:none; pointer-events:auto; }
  .send:hover,.send:focus-visible{ color:var(--lumen); outline:none; }

  /* confirmation replaces the field, same spot */
  .done{
    font-family:"Cormorant",Georgia,serif;
    font-size:1.7rem;
    font-weight:300;
    letter-spacing:.06em;
    color:var(--lumen);
    opacity:0;
    text-shadow:0 0 30px rgba(190,224,240,.3);
    transition:opacity 1.1s ease;
    min-height:1.7rem;
  }
  .note{
    display:block;
    margin-top:.9rem;
    font-size:.72rem;
    letter-spacing:.14em;
    color:#c98b8b;
    opacity:0;
    transition:opacity .4s ease;
  }
  .note.show{ opacity:.8; }

  .contact.sent .field,
  .contact.sent .cue{ opacity:0; pointer-events:none; transition:opacity .5s ease; }
  .contact.sent .done{ opacity:1; }

  /* ---- the aura: cool light that follows the cursor ---- */
  .aura{
    position:fixed;
    top:0; left:0;
    width:640px; height:640px;
    margin:-320px 0 0 -320px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(150,196,222,.16) 0%, rgba(120,170,200,.06) 32%, transparent 66%);
    mix-blend-mode:screen;
    pointer-events:none;
    transform:translate3d(var(--px,50vw),var(--py,44vh),0);
    z-index:1;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  .js .aura{ opacity:1; }

  /* touch / no-hover devices: keep everything comfortably legible */
  @media (hover:none){
    .js .word.base{ opacity:.16; }
    .sub{ opacity:.7; }
    .word.reveal{ --reveal-r:230px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
    .js .word.base{ opacity:.2; }
    .word.reveal{ --x:50%; --y:44%; --reveal-r:260px; }
    .aura{ display:none; }
  }
</style>
</head>
<body>

  <main class="stage">
    <div class="glyph">
      <span class="word base">ether</span>
      <span class="word reveal" aria-hidden="true">ether</span>
    </div>

    <p class="sub">strategic communications</p>

    <div class="contact" id="contact">
      <label class="cue" for="email">Leave a trace.</label>
      <div class="field" id="field">
        <input id="email" type="email" inputmode="email" autocomplete="email"
               placeholder="your email" aria-label="Your email address" />
        <button class="send" id="send" type="button" aria-label="Send">&#8250;</button>
      </div>
      <div class="done" id="done" role="status" aria-live="polite"></div>
      <span class="note" id="note"></span>
    </div>
  </main>

  <div class="aura" id="aura" aria-hidden="true"></div>

<script>
/* ------------------------------------------------------------------
   WIRING THE EMAIL FIELD  —  fill in ONE of these, then it's live.

   Option A · Web3Forms (no backend, ~2 min, keeps this a single file)
     1. Go to web3forms.com, enter the inbox you want leads to land in,
        copy the access key they email you.
     2. Paste it as web3formsKey below. Done.

   Option B · Supabase (fits your stack — a "leads" table)
     Run this once in the SQL editor:
        create table public.leads (
          id uuid primary key default gen_random_uuid(),
          email text not null,
          created_at timestamptz default now()
        );
        alter table public.leads enable row level security;
        create policy "anon can insert leads" on public.leads
          for insert to anon with check (true);
     Then paste your project URL + anon key below. (Anon key is safe to
     ship; the RLS policy allows insert-only, no reads.)

   Leave all blank = demo mode: the confirmation shows but nothing sends.
------------------------------------------------------------------- */
const CONFIG = {
  web3formsKey:   "",
  supabaseUrl:    "",
  supabaseAnonKey:"",
};

const $ = s => document.querySelector(s);
const email = $('#email'), field = $('#field'), send = $('#send'),
      contact = $('#contact'), done = $('#done'), note = $('#note');

const valid = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

email.addEventListener('input', () => {
  field.classList.toggle('filled', email.value.trim().length > 0);
  note.classList.remove('show');
});
email.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
send.addEventListener('click', submit);

async function submit(){
  const v = email.value.trim();
  if (!valid(v)){
    note.textContent = "That doesn't look like an email.";
    note.classList.add('show');
    email.focus();
    return;
  }
  send.style.pointerEvents = 'none';
  try{
    await deliver(v);
    done.textContent = "We'll find you.";
    contact.classList.add('sent');
  }catch(err){
    console.error(err);
    note.textContent = "The trace didn't take. Try again.";
    note.classList.add('show');
    send.style.pointerEvents = 'auto';
  }
}

async function deliver(addr){
  if (CONFIG.web3formsKey){
    const r = await fetch('https://api.web3forms.com/submit', {
      method:'POST',
      headers:{'Content-Type':'application/json', Accept:'application/json'},
      body: JSON.stringify({
        access_key: CONFIG.web3formsKey,
        subject: 'ether — new trace',
        email: addr,
        from_name: 'ethersc.com'
      })
    });
    if (!r.ok) throw new Error('web3forms '+r.status);
    return;
  }
  if (CONFIG.supabaseUrl && CONFIG.supabaseAnonKey){
    const r = await fetch(CONFIG.supabaseUrl.replace(/\/$/,'') + '/rest/v1/leads', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        apikey: CONFIG.supabaseAnonKey,
        Authorization: 'Bearer ' + CONFIG.supabaseAnonKey,
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ email: addr })
    });
    if (!r.ok) throw new Error('supabase '+r.status);
    return;
  }
  // demo mode — nothing wired yet
  console.warn('ether: no endpoint configured. Fill CONFIG in index.html to capture leads.');
  await new Promise(res => setTimeout(res, 350));
}

/* ---- the aura + reveal follow the cursor, with a little inertia (mist) ---- */
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const coarse = matchMedia('(hover:none)').matches;

let tx = innerWidth*0.5, ty = innerHeight*0.44;   // target
let cx = tx, cy = ty;                              // current (lerped)

function paint(){
  cx += (tx - cx) * 0.12;
  cy += (ty - cy) * 0.12;
  document.documentElement.style.setProperty('--x', cx + 'px');
  document.documentElement.style.setProperty('--y', cy + 'px');
  $('#aura').style.setProperty('--px', cx + 'px');
  $('#aura').style.setProperty('--py', cy + 'px');
  requestAnimationFrame(paint);
}

if (!reduce){
  if (!coarse){
    addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; }, {passive:true});
  } else {
    // no cursor to follow — let the light drift slowly across the mark
    let t = 0;
    (function drift(){
      t += 0.006;
      tx = innerWidth*(0.5 + 0.22*Math.sin(t));
      ty = innerHeight*(0.42 + 0.10*Math.sin(t*1.7));
      requestAnimationFrame(drift);
    })();
  }
  paint();
} else {
  // static, centred glow
  document.documentElement.style.setProperty('--x','50%');
  document.documentElement.style.setProperty('--y','44%');
}
</script>
</body>
</html>
